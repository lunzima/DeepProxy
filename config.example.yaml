# ============================================================
# Cross-Consult 双家族机制（v0.4，默认开启）
# ============================================================
# 两个并行机制共享 enabled 主开关与 pairs map：
#   1. tool-call: agent 主动 emit `cross_consult` 工具，向异家族 pro 模型请求单次
#      第二视角（强制 pro、context-free、原对话继续在源 provider）。
#   2. tag redirect: user 消息出现字面 `[本轮对话使用不同家族的大语言模型]` 时，
#      DeepProxy 把当前轮 + 后续 N 轮重路由到异家族 provider（按对方家族自身的
#      flash_upgrade 分级路由选档），窗口耗尽后自然回到源 provider。
# 详见 docs/mimo_integration.md §12 / §12.11。
#
# cross_consult:
#   enabled: true
#   tool_name: cross_consult            # 工具暴露给 agent 的名字
#   pairs:                              # 双向声明，无主副层级
#     deepseek: mimo
#     mimo: deepseek
#   max_calls_per_request: 3            # 单次 client 请求内 consult 次数上限
#   call_timeout_seconds: 30            # 单次 consult 超时
#   max_input_chars: 32000              # question + context 字符上限
#   max_output_tokens: 4096             # consult 调用 max_tokens
#   awareness_enabled: true             # 在 system prompt 注入双家族状态披露
#   redirect_enabled: true              # 标签触发的整轮 provider 重定向
#   redirect_persist_turns: 2           # 触发后额外保持重定向的轮数（含本轮共 3 轮）
#   redirect_tag_pattern: "\\[本轮对话使用不同家族的大语言模型\\]"
